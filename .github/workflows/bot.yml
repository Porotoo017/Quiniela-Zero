name: Bot Quiniela
on:
  push:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr scraper
        id: run
        run: |
          python quiniela_pro.py 2>&1 | tee output.txt
          if grep -q "CAMBIOS=1" output.txt; then
            echo "cambios=1" >> $GITHUB_OUTPUT
          else
            echo "cambios=0" >> $GITHUB_OUTPUT
          fi
      - name: Commit del DB si hubo cambios
        if: steps.run.outputs.cambios == '1'
        run: |
          git config user.name "quiniela-bot"
          git config user.email "bot@users.noreply.github.com"
          git add quiniela_pro.db resultados.txt
          git commit -m "data: actualización $(date -u +%Y-%m-%dT%H:%M)"
          git push
