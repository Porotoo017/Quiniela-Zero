name: Bot Quiniela

on:
  push:
  schedule:
    # Horarios en UTC (Hora Argentina + 3 horas)
    # Atrapa La Previa a las 11:00 ARG (14:00 UTC)
    - cron: "0 14 * * *"
    # Atrapa El Primero a las 12:45 ARG (15:45 UTC)
    - cron: "45 15 * * *"
    # Atrapa Matutino a las 15:45 ARG (18:45 UTC)
    - cron: "45 18 * * *"
    # Atrapa Vespertino a las 18:45 ARG (21:45 UTC)
    - cron: "45 21 * * *"
    # Atrapa Nocturno a las 21:45 ARG (00:45 UTC del día siguiente)
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        id: run
        run: |
          python quiniela_pro.py 2>&1 | tee output.txt
          if grep -q "CAMBIOS=1" output.txt; then
            echo "cambios=1" >> $GITHUB_OUTPUT
          else
            echo "cambios=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit del DB y Reporte
        run: |
          git config user.name "quiniela-bot"
          git config user.email "bot@users.noreply.github.com"
          git add quiniela_pro.db resultados.txt
          git commit -m "data: actualización $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          git push
