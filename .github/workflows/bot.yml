name: Bot Quiniela

on:
  push:
  schedule:
    - cron: "0 14 * * *"
    - cron: "45 15 * * *"
    - cron: "45 18 * * *"
    - cron: "45 21 * * *"
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python quiniela_pro.py 2>&1 | tee output.txt
          if grep -q "CAMBIOS=1" output.txt; then
            echo "cambios=1" >> $GITHUB_OUTPUT
          else
            echo "cambios=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit del DB y Reporte
        run: |
          git config user.name "quiniela-bot"
          git config user.email "bot@users.noreply.github.com"
          git add quiniela_pro.db resultados.txt fallos_consecutivos.txt || exit 0
          git commit -m "data: actualización $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          git push
